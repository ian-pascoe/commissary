# Checks every pull request and push to main, then deploys:
# - pull requests from this repository: a preview stage `pr-<number>` on its workers.dev URL (destroyed on close); with
#   the label `hosted-preview` the preview is a hosted proxy (PROXY_MODE=hosted, ADR 0026), without it a self-hosted one;
# - main: the `prod` stage (PROXY_MODE from the production environment, self-hosted when unset) and, once the `hosted`
#   environment is set up (`.env.hosted`, `pnpm ci:setup`), the `hosted` stage: a hosted proxy on its own domain.
# Deploy setup (environments, secrets, variables): docs/DEPLOY.md.
name: ci

on:
  pull_request:
    # labeled/unlabeled: adding or removing `hosted-preview` redeploys the preview in the other mode.
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # Deploy settings shared by every stage (infra/settings.ts); the environments hold the values.
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}

jobs:
  static:
    name: typecheck, lint, workflows
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'hosted-preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: static-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  test:
    name: test (${{ matrix.shard }}/3)
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'hosted-preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: test-${{ matrix.shard }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test --shard="$SHARD/3"
        env:
          SHARD: ${{ matrix.shard }}

  smoke:
    name: smoke (alchemy dev)
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'hosted-preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm smoke

  deploy:
    name: deploy ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    needs: [static, test, smoke]
    # Previews only for branches of this repository (fork and Dependabot runs get no deploy secrets).
    # Production only from main (a manual run on another branch must not deploy it).
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'hosted-preview') &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the preview URL comment
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    # One deploy per stage at a time; never cancel one midway.
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_LLM_PROXY_DOMAIN: ${{ vars.CF_LLM_PROXY_DOMAIN }}
      # The API host (ADR 0028); unset serves everything on CF_LLM_PROXY_DOMAIN. Previews ignore it.
      CF_LLM_PROXY_API_DOMAIN: ${{ vars.CF_LLM_PROXY_API_DOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_ALLOW_EMAILS: ${{ vars.ACCESS_ALLOW_EMAILS }}
      ACCESS_ALLOW_EMAIL_DOMAINS: ${{ vars.ACCESS_ALLOW_EMAIL_DOMAINS }}
      PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
      # Deprecated alias of PLATFORM_ADMIN_EMAILS: read until the variable is renamed.
      ACCESS_ADMIN_EMAILS: ${{ vars.ACCESS_ADMIN_EMAILS }}
      ACCESS_ALLOW_SERVICE_TOKEN_IDS: ${{ vars.ACCESS_ALLOW_SERVICE_TOKEN_IDS }}
      ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}
      # Rotation of the secrets key (docs/DEPLOY.md); unset means generation 1 and no rotation.
      SECRETS_KEY_GENERATION: ${{ vars.SECRETS_KEY_GENERATION }}
      SECRETS_KEY_PREVIOUS_GENERATION: ${{ vars.SECRETS_KEY_PREVIOUS_GENERATION }}
      # A hosted proxy (ADR 0026, docs/DEPLOY.md "Hosted proxy"): previews with the `hosted-preview` label, production
      # when its environment sets PROXY_MODE=hosted. The sign-in settings are read only then.
      PROXY_MODE: >-
        ${{ github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'hosted-preview') && 'hosted' || 'self-hosted') ||
        vars.PROXY_MODE }}
      SIGN_IN_GITHUB_CLIENT_ID: ${{ vars.SIGN_IN_GITHUB_CLIENT_ID }}
      SIGN_IN_GITHUB_CLIENT_SECRET: ${{ secrets.SIGN_IN_GITHUB_CLIENT_SECRET }}
      SIGN_IN_GOOGLE_CLIENT_ID: ${{ vars.SIGN_IN_GOOGLE_CLIENT_ID }}
      SIGN_IN_GOOGLE_CLIENT_SECRET: ${{ secrets.SIGN_IN_GOOGLE_CLIENT_SECRET }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OWNED_ORG_LIMIT: ${{ vars.OWNED_ORG_LIMIT }}
      ORG_RATE_LIMIT: ${{ vars.ORG_RATE_LIMIT }}
      ORG_RATE_LIMIT_NAMESPACE_ID: ${{ vars.ORG_RATE_LIMIT_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # No dependency cache in jobs holding deploy credentials (cache poisoning).
          cache: "false"
      - name: Build the control panel
        run: pnpm web:build
      - name: Deploy
        id: deploy
        run: tools/deploy-stage.sh "$STAGE"
      - name: Check the deploy and Access
        if: env.PROXY_MODE != 'hosted'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: tools/check-deploy.sh "$URL" "$API_URL"
      - name: Check the hosted deploy
        if: env.PROXY_MODE == 'hosted'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: tools/check-hosted-deploy.sh "$URL" "$API_URL"
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$PROXY_MODE" = hosted ]; then how="a hosted proxy: sign in with GitHub or Google"; else how="sign in with Access"; fi
          tools/preview-comment.sh "$PR" "Preview \`$STAGE\` deployed at $URL (commit ${SHA:0:8}), $how; storage starts empty and is destroyed when the pull request closes."

  # The hosted proxy (ADR 0026) deployed from main next to production: stage `hosted`, settings in the `hosted`
  # environment (docs/DEPLOY.md "Hosted production"). Skipped until that environment names a domain.
  deploy-hosted:
    name: deploy hosted
    needs: [static, test, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: hosted
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-hosted
      cancel-in-progress: false
    env:
      STAGE: hosted
      CONFIGURED: ${{ vars.CF_LLM_PROXY_DOMAIN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_LLM_PROXY_DOMAIN: ${{ vars.CF_LLM_PROXY_DOMAIN }}
      # The API host (ADR 0028); unset serves everything on CF_LLM_PROXY_DOMAIN. Previews ignore it.
      CF_LLM_PROXY_API_DOMAIN: ${{ vars.CF_LLM_PROXY_API_DOMAIN }}
      PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
      SECRETS_KEY_GENERATION: ${{ vars.SECRETS_KEY_GENERATION }}
      SECRETS_KEY_PREVIOUS_GENERATION: ${{ vars.SECRETS_KEY_PREVIOUS_GENERATION }}
      # Always hosted: infra/settings.ts refuses the stage otherwise.
      PROXY_MODE: hosted
      SIGN_IN_GITHUB_CLIENT_ID: ${{ vars.SIGN_IN_GITHUB_CLIENT_ID }}
      SIGN_IN_GITHUB_CLIENT_SECRET: ${{ secrets.SIGN_IN_GITHUB_CLIENT_SECRET }}
      SIGN_IN_GOOGLE_CLIENT_ID: ${{ vars.SIGN_IN_GOOGLE_CLIENT_ID }}
      SIGN_IN_GOOGLE_CLIENT_SECRET: ${{ secrets.SIGN_IN_GOOGLE_CLIENT_SECRET }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OWNED_ORG_LIMIT: ${{ vars.OWNED_ORG_LIMIT }}
      ORG_RATE_LIMIT: ${{ vars.ORG_RATE_LIMIT }}
      ORG_RATE_LIMIT_NAMESPACE_ID: ${{ vars.ORG_RATE_LIMIT_NAMESPACE_ID }}
    steps:
      - name: Not set up
        if: env.CONFIGURED != 'true'
        run: echo "::notice::the hosted environment sets no CF_LLM_PROXY_DOMAIN; skipping the hosted deploy (docs/DEPLOY.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CONFIGURED == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: env.CONFIGURED == 'true'
        with:
          # No dependency cache in jobs holding deploy credentials (cache poisoning).
          cache: "false"
      - name: Build the control panel
        if: env.CONFIGURED == 'true'
        run: pnpm web:build
      - name: Deploy
        id: deploy
        if: env.CONFIGURED == 'true'
        run: tools/deploy-stage.sh "$STAGE"
      - name: Check the hosted deploy
        if: env.CONFIGURED == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: tools/check-hosted-deploy.sh "$URL" "$API_URL"

  destroy-preview:
    name: destroy preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the preview comment
    environment:
      name: preview
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_ALLOW_EMAILS: ${{ vars.ACCESS_ALLOW_EMAILS }}
      ACCESS_ALLOW_SERVICE_TOKEN_IDS: ${{ vars.ACCESS_ALLOW_SERVICE_TOKEN_IDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Destroy
        run: |
          case "$STAGE" in pr-[0-9]*) ;; *) echo "::error::refusing to destroy stage $STAGE" >&2; exit 1 ;; esac
          pnpm run destroy --stage "$STAGE" --no-input --yes
      - name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/preview-comment.sh "$PR" "Preview \`$STAGE\` destroyed."
